services:
  basicvids_gateway:
    image: nginx:1.25-alpine
    container_name: basicvids_gateway
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - basicvids
    restart: unless-stopped

networks:
  basicvids:
    external: true
    name: basicvids
